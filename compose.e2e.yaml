name: bttr-client-e2e

services:
  mock-api:
    image: '${BTTR_MOCK_API_IMAGE:-bttr-server-mock:e2e}'
    build:
      context: ${BTTR_MOCK_API_CONTEXT:-../bttr-server/mock-api}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          curl --fail --silent --show-error
          http://localhost:8080/mock/health >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    init: true
    ipc: host
    working_dir: /workspace
    user: '${CI_UID:-1000}:${CI_GID:-1000}'
    environment:
      CI: 'true'
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/npm-cache
      BTTR_MOCK_API_URL: http://mock-api:8080
    volumes:
      - type: bind
        source: ${CI_WORKSPACE:-.}
        target: /workspace
    depends_on:
      mock-api:
        condition: service_healthy
    command:
      - sh
      - -c
      - npm ci && npm run test:e2e

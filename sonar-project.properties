sonar.projectKey=bttr-client-angular
sonar.projectName=BTTR Client Angular
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src,e2e
sonar.exclusions=src/**/*.spec.ts,src/setup-jest.ts
sonar.test.inclusions=src/**/*.spec.ts,src/setup-jest.ts,e2e/**/*.ts
sonar.coverage.exclusions=src/main.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.app.json,tsconfig.spec.json,tsconfig.e2e.json

x-node-service: &node-service
  image: node:22-bookworm-slim
  init: true
  working_dir: /workspace
  user: '${CI_UID:-1000}:${CI_GID:-1000}'
  environment:
    CI: 'true'
    HOME: /tmp
    NPM_CONFIG_CACHE: /tmp/npm-cache
  volumes:
    - type: bind
      source: ${CI_WORKSPACE:-.}
      target: /workspace

services:
  ci:
    <<: *node-service
    command:
      - sh
      - -c
      - npm ci && npm run ci && npm run build

  unit-tests:
    <<: *node-service
    command:
      - sh
      - -c
      - npm ci && npm run test:coverage -- --ci

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    working_dir: /usr/src
    user: '${CI_UID:-1000}:${CI_GID:-1000}'
    environment:
      HOME: /tmp
      SCANNER_WORKDIR_PATH: /usr/src/.scannerwork
      SONAR_HOST_URL: '${SONAR_HOST_URL:-}'
      SONAR_TOKEN: '${SONAR_TOKEN:-}'
      SONAR_USER_HOME: /tmp/.sonar
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - type: bind
        source: ${CI_WORKSPACE:-.}
        target: /usr/src

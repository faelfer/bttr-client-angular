# Cabeçalhos de segurança da publicação. São os mesmos aplicados por
# security/server.mjs, que é o alvo do scan OWASP ZAP no pipeline.
# Mantenha os dois arquivos em sincronia: o que o ZAP aprova é este conjunto.
#
# O nginx descarta os add_header herdados quando um bloco declara os seus, por
# isso este arquivo é incluído em cada location em vez de apenas no server.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

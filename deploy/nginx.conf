# Publicação do build de produção (dist/bttr/browser).
#
# Serve para dois propósitos: documentar o contrato de publicação e garantir que
# os cabeçalhos aprovados pelo ZAP no pipeline cheguem ao ambiente real. Copie
# este arquivo e deploy/security-headers.conf para /etc/nginx/conf.d/ e o
# conteúdo de dist/bttr/browser para /usr/share/nginx/html.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    include /etc/nginx/conf.d/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Configuração de execução: precisa ser relida sem recompilar o bundle.
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # O index.html referencia os bundles com hash; nunca pode ficar em cache.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Proxy reverso da API. A alternativa é apontar apiUrl em config.json para a
    # URL absoluta da API — nesse caso libere CORS no backend e acrescente essa
    # origem ao connect-src da CSP, que hoje é 'self'.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.conf;
        proxy_pass http://bttr-server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome; o fallback do SPA cai no location = /index.html.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ /index.html;
    }
}

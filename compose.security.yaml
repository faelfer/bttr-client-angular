name: bttr-client-security

x-node-service: &node-service
  image: node:22-bookworm-slim
  init: true
  working_dir: /workspace
  user: '${CI_UID:-1000}:${CI_GID:-1000}'
  environment:
    CI: 'true'
    HOME: /tmp
    NPM_CONFIG_CACHE: /tmp/npm-cache
  volumes:
    - type: bind
      source: ${CI_WORKSPACE:-.}
      target: /workspace

services:
  audit-build:
    <<: *node-service
    command:
      - sh
      - -c
      - npm ci && npm run security:audit && npm run build

  trivy:
    image: aquasec/trivy:0.74.0
    working_dir: /workspace
    environment:
      TRIVY_TIMEOUT: '${TRIVY_TIMEOUT:-60m}'
      TRIVY_DOWNLOAD_RETRIES: '${TRIVY_DOWNLOAD_RETRIES:-2}'
      TRIVY_DB_REPOSITORY: '${TRIVY_DB_REPOSITORY:-ghcr.io/aquasecurity/trivy-db:2}'
    volumes:
      - type: bind
        source: ${CI_WORKSPACE:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${CI_WORKSPACE:-.}/security-reports
        target: /reports
      - type: volume
        source: trivy-cache
        target: /root/.cache/trivy
    entrypoint: ['/bin/sh', '/workspace/security/trivy.sh']

  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    working_dir: /workspace
    user: '${CI_UID:-1000}:${CI_GID:-1000}'
    environment:
      HOME: /tmp
    volumes:
      - type: bind
        source: ${CI_WORKSPACE:-.}
        target: /workspace
        read_only: true
      - type: bind
        source: ${CI_WORKSPACE:-.}/security-reports
        target: /reports
    command:
      - git
      - --redact
      - --config
      - /workspace/.gitleaks.toml
      - --report-format
      - sarif
      - --report-path
      - /reports/gitleaks.sarif
      - /workspace

  mock-api:
    image: '${BTTR_MOCK_API_IMAGE:-bttr-server-mock:security}'
    build:
      context: ${BTTR_MOCK_API_CONTEXT:-../bttr-server/mock-api}
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          curl --fail --silent --show-error
          http://localhost:8080/mock/health >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    <<: *node-service
    command: ['node', 'security/server.mjs']
    depends_on:
      mock-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:4200/').then(response => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  zap:
    image: zaproxy/zap-stable:2.17.0
    shm_size: 2gb
    volumes:
      - type: bind
        source: ${CI_WORKSPACE:-.}/security/zap.yaml
        target: /zap/config/zap.yaml
        read_only: true
      - type: bind
        source: ${CI_WORKSPACE:-.}/security-reports
        target: /zap/wrk
    depends_on:
      web:
        condition: service_healthy
    command: ['zap.sh', '-cmd', '-autorun', '/zap/config/zap.yaml']

volumes:
  trivy-cache:
    external: true
    name: '${TRIVY_CACHE_VOLUME:-bttr-trivy-cache}'
